[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s2r-fireredtts3"
version = "0.1.0"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["."]
include = ["fireredtts3*"]

[tool.setuptools.package-data]
"*" = ["*.json"]
